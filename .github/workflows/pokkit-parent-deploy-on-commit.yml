# Deploy a Firebase Hosting preview channel when commits are pushed.
name: Pokkit Parent Deploy on Commit
on:
  push:
    branches-ignore:
      - main
concurrency:
  group: pokkit-parent-preview-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POKKIT_PARENT }}
          channelId: ${{ github.ref_name }}
          projectId: pokkit-parent
