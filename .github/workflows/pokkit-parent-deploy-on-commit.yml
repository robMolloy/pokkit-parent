# Deploy a Firebase Hosting preview channel for a pull request.
name: Pokkit Parent Deploy on Commit
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POKKIT_PARENT }}
          expires: 2h
          projectId: pokkit-parent
          disableComment: true

      - name: Post the preview link on the pull request
        if: steps.deploy.outputs.details_url != ''
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.details_url }}
          PREVIEW_EXPIRES: ${{ steps.deploy.outputs.expire_time_formatted }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const expires = process.env.PREVIEW_EXPIRES;
            const pr = context.payload.pull_request;
            const commit = pr.head.sha.slice(0, 7);
            const marker = "<!-- pokkit-parent-preview -->";
            const { owner, repo } = context.repo;
            const issue_number = pr.number;

            const lines = [
              marker,
              `Visit the preview URL for this PR (commit ${commit}):`,
              "",
              `[${url}](${url})`,
              "",
            ];
            if (expires) {
              lines.push(`<sub>(expires ${expires})</sub>`, "");
            }
            lines.push(
              "<sub>🔥 via [Firebase Hosting GitHub Action](https://github.com/marketplace/actions/deploy-to-firebase-hosting) 🌎</sub>",
            );
            const body = lines.join("\n");

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });
            core.info(`Created preview comment for commit ${commit}.`);
