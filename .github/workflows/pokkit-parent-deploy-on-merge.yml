# Deploy production Firebase Hosting when changes land on main.
name: Pokkit Parent Deploy on Merge
on:
  push:
    branches:
      - main
concurrency:
  group: pokkit-parent-live
  cancel-in-progress: true
permissions:
  checks: write
  contents: read
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POKKIT_PARENT }}
          channelId: live
          projectId: pokkit-parent
