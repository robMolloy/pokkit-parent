# Deploy production Firebase Hosting when changes land on main.
name: Pokkit Parent Deploy on Merge
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: pokkit-parent-live
  cancel-in-progress: false
permissions:
  checks: write
  contents: read
  deployments: write
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POKKIT_PARENT }}
          channelId: live
          projectId: pokkit-parent
          firebaseToolsVersion: 15.33.0
