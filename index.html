<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pokkit-parent</title>
    <script>
      const colorSchemeStorageKey = 'pokkit-dev-color-scheme'
      const themeMedia = window.matchMedia('(prefers-color-scheme: dark)')
      const readColorSchemePreference = () => {
        const stored = localStorage.getItem(colorSchemeStorageKey)
        return stored === 'light' || stored === 'dark' || stored === 'system'
          ? stored
          : 'system'
      }
      const applyTheme = () => {
        const preference = readColorSchemePreference()
        const dark =
          preference === 'dark'
            ? true
            : preference === 'light'
              ? false
              : themeMedia.matches
        document.documentElement.classList.toggle('dark', dark)
      }
      applyTheme()
      themeMedia.addEventListener('change', () => {
        if (readColorSchemePreference() === 'system') applyTheme()
      })
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
